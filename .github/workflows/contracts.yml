name: Contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: make contracts-fmt contracts-build
      - run: make contracts-test
        env:
          FOUNDRY_PROFILE: ci
      - run: make contracts-dry-run contracts-check-deployment contracts-abi
      - run: git diff --exit-code -- contracts/abi
