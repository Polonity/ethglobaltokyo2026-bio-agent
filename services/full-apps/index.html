<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fly Lab · Living worlds</title>
    <link rel="stylesheet" href="/experience.css" />
    <link rel="stylesheet" href="/guides/guide.css" />
  </head>
  <body data-app="foraging">
    <header class="app-header">
      <a href="/" class="brand"><img src="/assets/bioagent.png" alt="" />FLY <span>LAB</span></a>
      <nav aria-label="Applications">
        <button data-app="foraging"></button><button data-app="market"></button
        ><button data-app="aqua"></button>
      </nav>
      <div class="header-tools">
        <span class="network">● Anvil · local</span
        ><select id="language" aria-label="Language">
          <option value="system">System</option>
          <option value="en">English</option>
          <option value="ja">日本語</option></select
        ><button id="open-details" class="icon-button" aria-label="Details">ⓘ</button>
      </div>
    </header>
    <main id="world">
      <canvas id="arena" width="1440" height="850" role="img"></canvas>
      <section class="floating world-heading">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="app-title"></h1>
        <p id="intro"></p>
        <p class="status-line"><span class="status-dot"></span><span id="status" role="status"></span></p>
        <p id="progress-label" class="subtle"></p>
        <progress id="progress" value="0" max="1"></progress>
      </section>
      <section class="floating scoreboard" aria-label="Scores">
        <div class="section-heading">
          <h2 id="score-heading"></h2>
          <button class="icon-button" data-detail="scores" aria-label="Score details">ⓘ</button>
        </div>
        <p id="score-context"></p>
        <div id="cards" class="cards"></div>
        <p id="proxy-caption" class="proxy-caption" hidden></p>
      </section>
      <section id="battle-panel" class="floating battle-panel" hidden>
        <div class="section-heading">
          <h2 id="battle-heading"></h2>
          <span id="battle-unit"></span>
        </div>
        <div id="battle-bars"></div>
        <p id="battle-caption"></p>
      </section>
      <div id="idle-note" class="idle-note"></div>
      <section class="floating control-panel">
        <div class="control-caption">
          <strong id="control-title"></strong
          ><button class="icon-button" data-detail="controls" aria-label="Control details">ⓘ</button>
        </div>
        <div class="control-row">
          <label id="stimulus-control"
            ><span id="stimulus-label"></span
            ><input id="stimulus" type="range" min="0" max="1" step="0.05" value="0.5" /><output
              id="stimulus-value"
              >50%</output
            ></label
          ><button id="live" class="primary"></button><button id="stop"></button><button id="learn"></button>
        </div>
        <p id="control-help"></p>
        <p id="error" role="alert"></p>
      </section>
      <div class="scene-legend" id="scene-legend"></div>
    </main>
    <dialog id="details-dialog" aria-labelledby="details-title">
      <div class="dialog-header">
        <h2 id="details-title"></h2>
        <button id="close-details" class="icon-button" aria-label="Close">×</button>
      </div>
      <div class="detail-tabs" role="tablist">
        <button data-pane="help" role="tab"></button><button data-pane="evidence" role="tab"></button
        ><button data-pane="learning" role="tab"></button>
      </div>
      <div class="dialog-content">
        <section id="pane-help" role="tabpanel">
          <div id="metric-help"></div>
          <section id="app-guide" data-bio-guide data-app="foraging" data-mode="full"></section>
        </section>
        <section id="pane-evidence" role="tabpanel" hidden>
          <h3 id="evidence-heading"></h3>
          <p id="connection"></p>
          <p id="evidence-help"></p>
          <div id="tx"></div>
          <div id="aqua-proof"></div>
          <h3 id="model-heading"></h3>
          <p id="neural"></p>
          <p id="model-limits"></p>
          <a id="model-link" href="/models/full/foraging" target="_blank" rel="noopener"></a>
        </section>
        <section id="pane-learning" role="tabpanel" hidden>
          <h3 id="learning-heading"></h3>
          <p id="learning-help"></p>
          <label id="variant-label"
            ><select id="variant">
              <option value="full">Full MaleCNS · 166,700</option>
              <option value="legacy">7 neurons · comparison</option>
            </select></label
          >
          <p id="summary"></p>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th id="th-model"></th>
                  <th id="th-before"></th>
                  <th id="th-after"></th>
                  <th id="th-test"></th>
                </tr>
              </thead>
              <tbody id="comparison"></tbody>
            </table>
          </div>
          <p id="learning-unit"></p>
        </section>
      </div>
    </dialog>
    <dialog id="receipt-dialog" aria-labelledby="receipt-title">
      <div class="dialog-header">
        <h2 id="receipt-title"></h2>
        <button id="close-receipt" class="icon-button" aria-label="Close">×</button>
      </div>
      <div id="receipt-body" class="dialog-content"></div>
    </dialog>
    <script type="module" src="/guides/guide.mjs"></script>
    <script type="module" src="/experience.mjs"></script>
  </body>
</html>
